# Cyberpunk: neon on a midnight grid.
# Colors are "#rrggbb" or "#rrggbbaa".

id = "cyberpunk"
name = "Cyberpunk"

[metrics]
margin = 16.0
header_height = 38.0
scope_height = 182.0
section_height = 150.0
section_gap = 10.0
section_padding = 8.0
section_title_height = 24.0
section_title_indent = 16.0
keyboard_label_height = 30.0
attachment_height = 26.0
keyboard_octaves = 2

[background]
style = "gradient"
top = "#0d0221"
bottom = "#2a0b3d"

[background.grid]
color = "#ff2bd64d"
horizon_color = "#00f0ff"
horizon = 0.62
columns = 28
rows = 9

[text]
muted = "#7fa3c9"
shadow = "#000000a0"
label = { family = "monospace", size = 10.0 }
value = { family = "monospace", size = 11.0 }
section = { family = "monospace", size = 10.5 }
section_spacing = 3.0
hint = { family = "monospace", size = 10.0 }
subtitle = { family = "monospace", size = 11.0 }
subtitle_spacing = 2.5
uppercase_labels = true
uppercase_sections = true
uppercase_title = true
uppercase_info = true

[title]
font = { family = "monospace", size = 26.0 }
color = "#f0faff"
spacing = 6.0
effect = { style = "chromatic", left = "#ff2bd6b4", right = "#00f0ffb4", offset = 2.0 }

# The "SS" logo: an S, then the same S on its side as a sine wave
[logo]
height = 26.0
gap = 10.0
letter = "#f0faff"
wave = "#ff2bd6"
glow = "#ff2bd640"

[panel]
style = "neon_frame"
fill = "#0a0618d9"
border = "#00f0ff"
glow = "#00f0ff26"
corner_cut = 12.0

[knobs]
radius = 21.0
sweep_degrees = 270.0
endless_detents = 12
top_margin = 10.0
label_offset = 17.0
value_offset = 15.0

# Continuous controls: cyan neon rings
[knobs.continuous]
shape = "neon_ring"
body = "#0d0a1f"
rim = "#00f0ff"
face = "#151033"
highlight = "#00f0ff30"
pointer = "#00f0ff"
track = "#231a4a"
arc = "#00f0ff"
arc_active = "#7ffbff"
marker = "#231a4a"
marker_active = "#00f0ff"
label = "#7fa3c9"
value = "#e6f7ff"
value_active = "#7ffbff"
shadow = "#00000080"

# Selectors: yellow segmented dials
[knobs.selector]
shape = "neon_segments"
body = "#1a0a24"
rim = "#fcee0a"
face = "#25103a"
highlight = "#fcee0a40"
pointer = "#fcee0a"
track = "#2a1a40"
arc = "#fcee0a"
arc_active = "#fff38a"
marker = "#3a2a55"
marker_active = "#fcee0a"
label = "#fcee0a"
value = "#fcee0a"
value_active = "#fff38a"
shadow = "#00000080"

# Left-to-right position switches, like the octave switch
[switch]
width = 88.0
track = "#150f33"
track_edge = "#00f0ff80"
thumb = "#ff2bd6"
thumb_active = "#ff7be6"
thumb_edge = "#2a0b3d"
glow = "#ff2bd640"
tick = "#5a6f9a"
tick_active = "#ff2bd6"
font = { family = "monospace", size = 8.5 }

[scope]
bezel = "panel"
bezel_inset = 10.0
glass = "#05020df0"
glass_edge = "#ff2bd650"
inner_shadow = "#00000080"
grid = "#1b1540"
grid_center = "#3a2a7a"
grid_columns = 12
trace = "#ff2bd6"
trace_width = 1.8
glow = 1.3
scanlines = "#00f0ff0d"
info = "#00f0ffaa"
note = "#fcee0a"
font = { family = "monospace", size = 10.5 }

[keyboard]
panel = true
white = "#140f2e"
black = "#07050f"
held = "#ff2bd6"
sounding = "#00f0ff"
outline = "#00f0ff60"
label = "#7fa3c9"
black_label = "#5a6f9a"
active_label = "#07050f"
octave_label = "#ff2bd6"
font = { family = "monospace", size = 10.0 }
corner_radius = 1.0

[switcher]
text = "#7fa3c9"
hover = "#fcee0a"
font = { family = "monospace", size = 9.5 }
