# English (US) — the default language. Other packs fall back to this one for missing keys.
# Units include their leading space, since spacing rules differ between languages.

id = "en-US"
name = "English (US)"
short_name = "EN"

[number]
decimal_separator = "."

[notes]
names = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"]
# Middle C (MIDI 60) is C4
octave_offset = -1

